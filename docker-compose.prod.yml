services:
  app:
    build: .
    container_name: modul-9-app
    ports:
      - "127.0.0.1:8501:8501"
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
